[package]
name = "mague-rc"
version = "0.1.0"
edition = "2024"

[dependencies]
async-stream = "0.3.6"
dotenvy = "0.15.7"
eventsource-stream = "0.2.3"
futures-channel = "0.3.31"
futures-util = "0.3.31"
pulldown-cmark = "0.13.0"
reqwest = { version = "0.13.4", default-features = false, features = [
    "json",
    "rustls-no-provider",
    "stream",
] }
rustls = { version = "0.23.42", default-features = false, features = ["ring", "std"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.142"
thiserror = "2.0.12"
tokio = { version = "1.47.0", features = [
    "io-util",
    "macros",
    "process",
    "rt-multi-thread",
    "signal",
    "sync",
    "time",
] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter", "fmt"] }
tokio-tungstenite = { version = "0.30.0", default-features = false, features = [
    "connect",
    "rustls-tls-native-roots",
] }
url = "2.5.4"
gtk = { package = "gtk4", version = "0.11.4", features = ["v4_16"] }
gtk4-layer-shell = "0.8.0"
